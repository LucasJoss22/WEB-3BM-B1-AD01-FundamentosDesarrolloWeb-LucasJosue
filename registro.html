<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - DriveFix</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SweetAlert2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Taller Mecanico DriveFix</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="servicios.html">Servicios</a>
            <a href="contacto.html">Contacto</a>
            <a href="login.html" class="link-login">Iniciar Sesión</a>
        </nav>
    </header>

    <div class="contenedor-login" style="width: 500px;">
        <h2>Crear Cuenta de Cliente</h2>
        <p class="subtitulo">Registra tus datos personales y los de tu vehículo</p>

        <form id="formRegistro">
            <div class="row">
                <div class="col-md-6 mb-2">
                    <label for="regNombre">Nombre Completo (*):</label>
                    <input type="text" id="regNombre" placeholder="Ingresa tu nombre y apellido" required>
                </div>
                <div class="col-md-6 mb-2">
                    <label for="regUsuario">Nombre de Usuario (*):</label>
                    <input type="text" id="regUsuario" placeholder="Elige un usuario" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-2">
                    <label for="regPassword">Contraseña (*):</label>
                    <input type="password" id="regPassword" placeholder="Ingresa tu contraseña" required>
                </div>
                <div class="col-md-6 mb-2">
                    <label for="regCorreo">Correo Electrónico (*):</label>
                    <input type="email" id="regCorreo" placeholder="correo@ejemplo.com" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-2">
                    <label for="regTelefono">Teléfono / Celular (*):</label>
                    <input type="tel" id="regTelefono" placeholder="0987654321" required>
                </div>
                <div class="col-md-6 mb-2">
                    <label for="regPlaca">Placa del Auto (*):</label>
                    <input type="text" id="regPlaca" placeholder="ABC-1234" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-2">
                    <label for="regMarca">Marca (*):</label>
                    <input type="text" id="regMarca" placeholder="Ej: Chevrolet" required>
                </div>
                <div class="col-md-4 mb-2">
                    <label for="regModelo">Modelo (*):</label>
                    <input type="text" id="regModelo" placeholder="Ej: Aveo" required>
                </div>
                <div class="col-md-4 mb-2">
                    <label for="regAnio">Año (*):</label>
                    <input type="number" id="regAnio" min="1990" max="2027" placeholder="Año del vehículo" required>
                </div>
            </div>

            <div class="mb-2">
                <label for="regKm">Kilometraje actual (km) (*):</label>
                <input type="number" id="regKm" min="0" placeholder="Kilometraje en km" required>
            </div>

            <button type="submit" id="btnRegistrarse" class="btn btn-success w-100 mt-2">Registrarme como Cliente</button>
        </form>

        <div style="text-align: center; margin-top: 15px;">
            <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a></p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Taller DriveFix. Instituto Superior Tecnológico Cordillera.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="datos.js"></script>
    <script src="registro.js"></script>
</body>
</html>
